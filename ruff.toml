# Ruff configuration.
#
# Scope is deliberately narrow. This codebase is ~35k lines written without a
# linter, so turning on everything at once would produce thousands of findings
# and the useful ones would drown. What is enabled here is the set that catches
# real defects or removes real dead weight; style-only rules are left off until
# someone decides they are worth a mechanical diff across every file.
#
#   F   pyflakes      — unused imports, unused locals, undefined names,
#                       redefinitions. This is the category that finds bugs.
#   I   isort         — import ordering. Autofixable, zero behaviour risk, and
#                       it stops import blocks drifting per-file.
#   UP  pyupgrade     — syntax that is obsolete on the minimum supported
#                       Python (3.10, per the CI matrix).
#   B   bugbear       — mutable default arguments, loop-variable capture in
#                       closures, and similar genuine footguns.
#
# NOT enabled, and why:
#   E501 line-too-long — 856 occurrences. The codebase uses long lines for
#        aligned numeric tables and box-drawing section rules, where wrapping
#        makes them worse. Reformatting is a decision, not a lint fix.
#   D    pydocstyle   — docstrings here are prose-first and deliberately
#        discursive; enforcing a template would degrade them.

target-version = "py310"
line-length = 100          # advisory only; E501 is not in `select`

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    # Retired snapshot of the allocator, kept for reference. Slated for
    # deletion in Phase 2.3 (dead code); linting it now is noise.
    "allocate_funds_v0.9.py",
    # Legacy scratch scripts, not part of the application.
    "test/",
]

[lint]
select = ["F", "I"]

ignore = [
    # 20 genuinely dead locals across 11 files (allocate_funds, engine,
    # monte_carlo, main, ...). Each is a one-line deletion, but several sit in
    # engine.py, whose behaviour is frozen by the golden snapshots, and
    # ruff's fix for F841 is classed unsafe because it removes the whole
    # statement including any side effect in the right-hand side.
    #
    # Queued for Phase 2.3 (delete dead code), which owns exactly this.
    # DELETE THIS IGNORE when 2.3 lands -- `ruff check --select F841 .` lists
    # the twenty.
    "F841",
]

[lint.per-file-ignores]
# `import models` inside a try/except ImportError is an availability probe,
# not an unused import. Ruff suggests importlib.util.find_spec; rewriting a
# standalone-runnable script for a linter is the wrong trade.
"test_swp_engine.py" = ["F401"]

# Patchers and one-off scripts import lazily inside functions on purpose.
"scripts/*" = ["F401"]
# conftest sets sys.path before importing project modules, so the E402-style
# ordering is intentional; ruff's I rules would reorder it wrongly.
"conftest.py" = ["I001"]
"tests/golden/conftest.py" = ["I001"]

[lint.isort]
known-first-party = [
    "allocate_funds", "chart_dialog", "chunk_editor", "configuration",
    "dialogs", "engine", "fund_dialog", "get_funds_data", "glide_path",
    "main", "models", "monte_carlo", "needs_assessment",
    "optimization_report", "tax_dialog",
]

[format]
# Not used yet. `ruff format` would reflow every file in the repo; that is a
# separate decision from linting and should be its own commit if taken.
quote-style = "preserve"
