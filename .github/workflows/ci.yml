name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libdbus-1-3
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile-check every module
        run: python -m compileall -q .
      - name: Smoke tests (clone must be importable)
        run: pytest tests/test_smoke.py -v
      - name: Full suite
        # -n 4 is not for speed. Splitting the suite across workers is what
        # exposes order-dependent tests a sequential run hides; that is how
        # a965e4a was found (HANDOVER §9.10). Four workers to match the
        # documented local command exactly.
        run: pytest -v -n 4 -m "not network"

  guard-personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse generated data
        run: |
          set -e
          bad=$(git ls-files '*_Personal_Monthly.csv' '*_HUF_Monthly.csv' \
                  'Fund_Metrics_Output.csv' 'allocation_chunk_*.csv' || true)
          if [ -n "$bad" ]; then
            echo "::error::Generated data is tracked:"; echo "$bad"; exit 1
          fi
          echo "Clean."
